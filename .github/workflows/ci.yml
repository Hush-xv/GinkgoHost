name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build GinkgoHost -c Release

      # 无硬件冒烟：DLL 加载 / 入口点 / 解析器 / 服务参数校验 / 日志边界
      - name: Smoke test
        run: dotnet run --project GinkgoHost/tests/SmokeTest -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish framework-dependent
        run: dotnet publish GinkgoHost -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/fdd

      - name: Publish self-contained
        run: dotnet publish GinkgoHost -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/scd

      - name: Pack zips
        shell: pwsh
        run: |
          Compress-Archive -Path publish/fdd/GinkgoHost.exe,publish/fdd/Ginkgo_Driver.dll -DestinationPath "GinkgoHost-$($env:GITHUB_REF_NAME)-win-x64.zip"
          Compress-Archive -Path publish/scd/GinkgoHost.exe,publish/scd/Ginkgo_Driver.dll -DestinationPath "GinkgoHost-$($env:GITHUB_REF_NAME)-win-x64-selfcontained.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          "GinkgoHost-$($env:GITHUB_REF_NAME)-win-x64.zip"
          "GinkgoHost-$($env:GITHUB_REF_NAME)-win-x64-selfcontained.zip"
          --title "$env:GITHUB_REF_NAME"
          --generate-notes
